<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MCC - Edit Hostel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f172a;--gold:#c9a86a;--cream:#FFFBF5;--sand:#F2E8D5;--line:#F6F1E8;--mut:#64748b;--sh:0 20px 60px rgba(15,23,42,.06),0 2px 12px rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--cream);color:var(--navy);line-height:1.5;padding:16px 16px 60px;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
input,select,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{max-width:720px;margin:12px auto;background:#fff;border-radius:24px;padding:22px;box-shadow:var(--sh);border:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-family:"Playfair Display",serif;font-size:26px;line-height:1.1}
.sub{font-size:12px;color:var(--mut);margin-top:4px}
.sec{margin-top:26px}.sec h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding-bottom:6px;border-bottom:1px solid var(--sand)}
.fl{display:block;font-size:12px;font-weight:600;margin-top:14px}
.field{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--sand);background:var(--cream);outline:0;margin-top:6px;transition:border-color .2s}
.field:focus{border-color:var(--gold)}textarea.field{min-height:100px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--mut);margin-top:4px;font-weight:400}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chk{position:relative}.chk input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%}
.chk span{display:inline-block;padding:9px 16px;border-radius:99px;border:1.5px solid var(--sand);font-size:12px;font-weight:600;background:#fff;transition:.2s}
.chk input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.chk input:focus-visible+span{outline:3px solid var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-radius:99px;font-weight:700;font-size:13px;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.6;transform:none;cursor:wait}
.btn.dark{background:var(--navy);color:#fff}.btn.line{border:1.5px solid var(--sand);background:#fff}.btn.sm{padding:8px 14px;font-size:11px}.btn.full{width:100%;padding:15px;font-size:14px;margin-top:22px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.photos img{width:84px;height:64px;object-fit:cover;border-radius:12px;background:var(--sand)}
.msg{font-size:13px;text-align:center;margin-top:14px;min-height:20px;font-weight:500}
.banner{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:18px;border-radius:18px;font-size:14px;text-align:center;margin-top:18px}
@media(max-width:480px){.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="card">
 <div class="top"><div><h1>Edit Hostel</h1><p class="sub">Update your hostel details. Your photos stay as they are.</p></div><a class="btn line sm" href="manager-dashboard.html">Dashboard</a></div>
 <div class="banner" id="fail" hidden></div>

 <form id="form" hidden novalidate>
  <div class="sec"><h2>Basics</h2>
   <label class="fl" for="hname">Hostel name *</label><input class="field" id="hname" maxlength="60" autocomplete="off">
   <label class="fl" for="location">Location *</label><input class="field" id="location" list="locs" maxlength="40" autocomplete="off"><datalist id="locs"><option value="Amamoma"><option value="Ayensu"><option value="Kwaprow"><option value="3rd Gate"></datalist>
   <label class="fl" for="distance">Distance to campus (optional)<span class="hint">Type it with a unit, e.g. "5 min walk" or "1.2 km"</span></label><input class="field" id="distance" maxlength="40" autocomplete="off">
   <label class="fl" for="desc">Description</label><textarea class="field" id="desc" maxlength="1000"></textarea>
  </div>

  <div class="sec"><h2>Room &amp; price</h2>
   <label class="fl" for="type">Room type *</label><select class="field" id="type"><option value="Single Room">Single Room</option><option value="Self Contain">Self Contain</option><option value="2 in 1">2 in 1</option><option value="3 in 1">3 in 1</option><option value="4 in 1">4 in 1</option></select>
   <div class="two"><label class="fl" for="price">Price per year (GH₵) *<input class="field" id="price" type="number" min="1" inputmode="numeric"></label>
    <label class="fl" for="priceSem">Price per semester (GH₵)<input class="field" id="priceSem" type="number" min="1" inputmode="numeric" placeholder="Optional"></label></div>
   <div class="two"><label class="fl" for="beds">Total beds *<input class="field" id="beds" type="number" min="1" inputmode="numeric"></label>
    <label class="fl" for="roomsLeft">Rooms left now<input class="field" id="roomsLeft" type="number" min="0" max="999" inputmode="numeric" placeholder="Optional"></label></div>
  </div>

  <div class="sec"><h2>Who is it for? *</h2>
   <div class="checks" id="gender"><label class="chk"><input type="checkbox" value="male"><span>Male</span></label><label class="chk"><input type="checkbox" value="female"><span>Female</span></label><label class="chk"><input type="checkbox" value="mixed"><span>Mixed</span></label></div>
  </div>

  <div class="sec"><h2>Amenities</h2>
   <div class="checks" id="amen"><label class="chk"><input type="checkbox" value="WiFi"><span>WiFi</span></label><label class="chk"><input type="checkbox" value="Water"><span>Water</span></label><label class="chk"><input type="checkbox" value="Kitchen"><span>Kitchen</span></label><label class="chk"><input type="checkbox" value="Light"><span>Light</span></label><label class="chk"><input type="checkbox" value="Security"><span>Security</span></label><label class="chk"><input type="checkbox" value="Self-Contained"><span>Self-Contained</span></label></div>
  </div>

  <div class="sec"><h2>Photos</h2><div class="photos" id="photos"></div><p class="hint">Photos cannot be changed on this page yet.</p></div>

  <div class="sec"><h2>Contact</h2>
   <label class="fl" for="phone">WhatsApp number *</label><input class="field" id="phone" type="tel" inputmode="tel" autocomplete="tel">
  </div>

  <button class="btn dark full" id="saveBtn">Save changes</button>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
 </form>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { doc, getDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const num=v=>{v=String(v??'').trim();if(v==='')return null;const n=Number(v);return Number.isFinite(n)?n:null};
const normPhone=p=>{let s=String(p||'').replace(/\D/g,'');if(s.startsWith('00'))s=s.slice(2);if(s.startsWith('0'))s='233'+s.slice(1);else if(s.length===9)s='233'+s;return s};
const safeUrl=u=>{u=String(u||'').trim();return /^(https:\/\/|data:image\/)/i.test(u)?u:''};
const say=(t,c)=>{const m=$('#msg');m.textContent=t;m.style.color=c==='red'?'#b91c1c':c==='green'?'#15803d':'inherit'};
const fail=t=>{$('#fail').textContent=t;$('#fail').hidden=false;$('#form').hidden=true};
const AMS=['WiFi','Water','Kitchen','Light','Security','Self-Contained'];
const AMRE={'WiFi':/wifi|internet/,'Water':/water/,'Kitchen':/kitchen|cook/,'Light':/light|electric|power/,'Security':/secur|cctv|guard/,'Self-Contained':/selfcontain|ensuite/};
const ID=new URLSearchParams(location.search).get('id')||'';
let cur=null,busy=false;try{cur=JSON.parse(localStorage.getItem('mcc_current_manager')||'null')}catch{}

function currentAmenities(h){
 const a=Array.isArray(h.amenities)?h.amenities:typeof h.amenities==='string'?h.amenities.split(','):[];
 const keys=a.map(x=>String(x).toLowerCase().replace(/[^a-z]/g,'')),on=new Set();
 AMS.forEach(n=>{if(keys.some(k=>AMRE[n].test(k)))on.add(n)});
 if(/self[\s-]?contain/i.test(String(h.type||'')))on.add('Self-Contained');
 return on}
function fill(h){
 $('#hname').value=h.name||'';$('#location').value=h.location||'';$('#distance').value=h.distance||'';$('#desc').value=h.description||'';
 const t=$('#type');if(h.type&&![...t.options].some(o=>o.value===h.type)){t.add(new Option(h.type,h.type))}t.value=h.type||t.options[0].value;
 $('#price').value=h.price??'';$('#priceSem').value=h.priceSemester??'';$('#beds').value=h.beds??'';$('#roomsLeft').value=h.roomsLeft??'';
 const g=Array.isArray(h.gender)?h.gender:h.gender?[h.gender]:[];$$('#gender input').forEach(i=>i.checked=g.map(x=>String(x).toLowerCase()).includes(i.value));
 const am=currentAmenities(h);$$('#amen input').forEach(i=>i.checked=am.has(i.value));
 $('#phone').value=h.managerPhone||'';
 const imgs=(Array.isArray(h.images)?h.images:[]).map(safeUrl).filter(Boolean);
 $('#photos').innerHTML=imgs.map((u,i)=>`<img src="${u}" alt="Photo ${i+1}" loading="lazy">`).join('')||'<span class="hint">No photos.</span>'}

async function init(){
 if(!/^[A-Za-z0-9]{10,40}$/.test(ID))return fail('No hostel selected. Open this page from your dashboard.');
 let snap;try{snap=await getDoc(doc(db,'hostels',ID))}catch{return fail('You do not have access to this hostel.')}
 if(!snap.exists())return fail('Hostel not found.');
 const h=snap.data();
 if(String(h.managerEmail||'').toLowerCase()!==String(cur.email).toLowerCase())return fail('This hostel belongs to another manager.');
 fill(h);$('#form').hidden=false;$('#form').addEventListener('submit',save)}

async function save(e){
 e.preventDefault();if(busy)return;
 const name=$('#hname').value.trim(),loc=$('#location').value.trim(),price=num($('#price').value),sem=num($('#priceSem').value),beds=num($('#beds').value),left=num($('#roomsLeft').value),
  distance=$('#distance').value.trim(),desc=$('#desc').value.trim(),gender=$$('#gender input:checked').map(i=>i.value),amenities=$$('#amen input:checked').map(i=>i.value),
  phoneRaw=$('#phone').value.trim(),phone=normPhone(phoneRaw);
 let err='';
 if(name.length<3)err='Enter the hostel name.';else if(!loc)err='Enter the location.';else if(!(price>0))err='Enter the price per year.';
 else if(sem!==null&&!(sem>0))err='Semester price must be more than 0.';else if(!(beds>=1))err='Enter the number of beds.';
 else if(left!==null&&!(left>=0&&left<=999))err='Rooms left must be from 0 to 999.';else if(!gender.length)err='Choose who the hostel is for (Male, Female or Mixed).';
 else if(!/^\d{10,15}$/.test(phone))err='Enter a valid WhatsApp number.';
 if(err){say(err,'red');return}
 busy=true;const btn=$('#saveBtn');btn.disabled=true;btn.textContent='Saving…';say('');
 try{
  await updateDoc(doc(db,'hostels',ID),{
   name,location:loc,price,beds:Math.floor(beds),type:$('#type').value,description:desc,managerPhone:phoneRaw,gender,amenities,
   priceSemester:sem!==null?sem:deleteField(),
   roomsLeft:left!==null?Math.floor(left):deleteField(),
   distance:distance?distance:deleteField()
  });
  say('✅ Saved! Going back to your dashboard…','green');btn.textContent='Saved!';
  setTimeout(()=>location.href='manager-dashboard.html',1200);
 }catch(ex){console.error(ex);say('Could not save: '+(ex.code||ex.message),'red');btn.disabled=false;btn.textContent='Save changes';busy=false}
}

/* same login as the other manager pages: must be signed in with Firebase */
await auth.authStateReady();
if(!cur||!cur.email||!auth.currentUser||String(auth.currentUser.email||'').toLowerCase()!==String(cur.email).toLowerCase()){localStorage.removeItem('mcc_current_manager');location.replace('manager-login.html')}else{init()}
</script>
</body>
</html>
