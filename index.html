<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyCampusCrib - Luxury Student Hostels</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f8fafc] font-[Poppins]">
<header class="bg-white p-4 flex items-center justify-between shadow-sm sticky top-0 z-50">
<div class="flex items-center gap-3">
<img src="logo.png" class="w-10 h-10 rounded-full bg-[#0f172a]" onerror="this.src='https://via.placeholder.com/40?text=MCC'">
<h1 class="font-[Playfair_Display] font-bold">MyCampusCrib<span class="text-[#c9a86a]">.Luxury</span></h1>
</div>
<div class="flex gap-2">
<a href="manager-login.html" class="text-[11px] bg-[#0f172a] text-white px-3 py-2 rounded-full">Manager</a>
<a href="ceo-dashboard.html" class="text-[11px] bg-slate-100 px-3 py-2 rounded-full">CEO</a>
</div>
</header>

<div class="p-4 max-w-6xl mx-auto">
<div class="bg-[#0f172a] text-white rounded-[20px] p-5 mb-4">
<h2 class="font-[Playfair_Display] text-xl">Find Your Luxury Crib</h2>
<p class="text-[11px] opacity-70 mt-1">Verified hostels around UCC, Cape Coast</p>
<input id="search" onkeyup="filterHostels()" placeholder="Search Amamoma, Kwaprow..." class="w-full mt-3 p-3 rounded-xl text-sm text-black">
</div>

<div id="hostels" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
<p class="text-xs text-slate-400">Loading hostels LIVE...</p>
</div>
</div>

<!-- Detail Modal -->
<div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
<div class="bg-white rounded-[20px] max-w-lg w-full p-4 max-h-[90vh] overflow-y-auto">
<button onclick="closeModal()" class="float-right bg-slate-100 px-3 py-1 rounded-full text-xs">Close</button>
<div id="modalContent"></div>
</div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, addDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let allHostels=[];

async function loadHostels(){
  const box=document.getElementById('hostels');
  try{
    const snap=await getDocs(query(collection(db,"hostels"), orderBy("createdAt","desc")));
    allHostels=[];
    snap.forEach(d=> allHostels.push({id:d.id, ...d.data()}));
    render(allHostels);
  }catch(e){
    // fallback if no index
    const snap2=await getDocs(collection(db,"hostels"));
    allHostels=[]; snap2.forEach(d=> allHostels.push({id:d.id, ...d.data()}));
    render(allHostels);
  }
}

function render(list){
  const box=document.getElementById('hostels');
  if(list.length===0){ box.innerHTML="<p class='text-xs text-slate-400'>No hostels yet</p>"; return; }
  box.innerHTML="";
  list.forEach(h=>{
    box.innerHTML+=`<div class="bg-white rounded-[20px] overflow-hidden shadow-sm cursor-pointer" onclick="openModal('${h.id}')">
    <img src="${h.images?.[0]||''}" class="w-full h-44 object-cover">
    <div class="p-3">
    <div class="flex justify-between items-start"><h3 class="font-bold text-sm">${h.name}</h3><span class="text-[10px] bg-green-50 text-green-600 px-2 py-1 rounded-full">${h.status||'approved'}</span></div>
    <p class="text-[11px] text-slate-500">${h.location} • ${h.type||''}</p>
    <div class="flex justify-between items-center mt-2"><p class="font-bold text-[#0f172a]">GH₵${h.price}</p><p class="text-[10px] text-slate-400">${h.beds||1} beds</p></div>
    </div></div>`;
  });
}

window.filterHostels = function(){
  const s=document.getElementById('search').value.toLowerCase();
  const f=allHostels.filter(h=> (h.name+h.location+h.type).toLowerCase().includes(s));
  render(f);
}

window.openModal = function(id){
  const h=allHostels.find(x=>x.id===id);
  if(!h) return;
  const m=document.getElementById('modal'); const c=document.getElementById('modalContent');
  c.innerHTML=`
  <img src="${h.images?.[0]||''}" class="w-full h-56 object-cover rounded-xl mb-3">
  <h2 class="font-bold text-lg">${h.name}</h2>
  <p class="text-xs text-slate-500">${h.location} • ${h.type} • ${h.beds} beds</p>
  <p class="text-sm mt-2">${h.description||''}</p>
  <p class="font-bold mt-3 text-lg">GH₵${h.price}/year</p>
  ${h.videoUrl?`<video src="${h.videoUrl}" controls class="w-full mt-3 rounded-xl"></video>`:''}
  <div class="grid grid-cols-3 gap-2 mt-3">${(h.images||[]).map(u=>`<img src="${u}" class="h-20 object-cover rounded-lg">`).join('')}</div>
  <button onclick="contactManager('${h.id}')" class="w-full bg-[#25D366] text-white p-3 rounded-xl font-bold mt-4">WhatsApp Manager - Get CODE</button>
  <p class="text-[10px] text-slate-400 text-center mt-2">A tracking code MCC-XXXX will be generated for admin & manager</p>
  `;
  m.classList.remove('hidden'); m.classList.add('flex');
}

window.closeModal = function(){ document.getElementById('modal').classList.add('hidden'); }

window.contactManager = async function(hostelId){
  const h=allHostels.find(x=>x.id===hostelId);
  const code = `MCC-${Math.floor(1000+Math.random()*9000)}`; // MCC-7821
  
  try{
    // Save inquiry code to Firebase - visible to CEO + Manager
    await addDoc(collection(db,"inquiries"),{
      code, hostelId: h.id, hostelName: h.name, managerEmail: h.managerEmail,
      managerPhone: h.managerPhone, status:"new", createdAt: serverTimestamp()
    });
  }catch(e){ console.error("Inquiry save failed", e); }

  // Open WhatsApp with code
  const phone = h.managerPhone.replace(/[^0-9]/g,''); // clean
  const ghPhone = phone.startsWith('0')? '233'+phone.substring(1) : phone;
  const text = `Hi, I saw *${h.name}* on MyCampusCrib. Location: ${h.location}. Price: GH₵${h.price}.%0A%0AMy Inquiry Code: *${code}*%0A%0AIs it still available?`;
  window.open(`https://wa.me/${ghPhone}?text=${text}`, '_blank');
}

loadHostels();
</script>
</body>
</html>
