<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MCC - Manager Login</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f172a;--gold:#c9a86a;--cream:#FFFBF5;--sand:#F2E8D5;--mut:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:#f8fafc;color:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;width:100%;max-width:440px;border-radius:20px;padding:26px;box-shadow:0 20px 50px rgba(15,23,42,.12)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand img,.logo{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--navy);flex:none}
.logo{display:grid;place-items:center;color:var(--gold);font-weight:700;font-size:13px}
.brand h1{font-family:"Playfair Display",serif;font-size:20px;line-height:1.1}.brand h1 span{color:var(--gold)}
h2{font-size:18px}.sub{font-size:12px;color:var(--mut);margin:2px 0 14px}
label{display:block;font-size:12px;font-weight:600;margin-top:12px}
input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;margin-top:6px;font:inherit;font-size:14px;outline:0}
input:focus{border-color:var(--gold)}
button.main{width:100%;margin-top:18px;background:var(--navy);color:#fff;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
button.main:disabled{opacity:.6;cursor:wait}
.msg{font-size:13px;text-align:center;margin-top:14px;min-height:20px}
a,.lnk{display:block;text-align:center;font-size:12px;margin-top:14px;color:var(--mut);text-decoration:none;background:none;border:0;font-family:inherit;cursor:pointer;width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="box">
 <div class="brand">
  <img src="logo.png" alt="MCC Logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo',textContent:'MCC'}))">
  <h1>MyCampusCrib<span>.Luxury</span></h1>
 </div>
 <h2>Manager Login</h2>
 <p class="sub">Access your dashboard</p>
 <form id="f" novalidate>
  <label for="email">Email</label><input id="email" type="email" autocomplete="email">
  <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
  <button class="main" id="btn">Login</button>
 </form>
 <p class="msg" id="msg" role="status" aria-live="polite"></p>
 <button class="lnk" id="forgot" type="button">Forgot password?</button>
 <a href="manager-signup.html">No account? Sign up</a>
 <a href="index.html" style="margin-top:6px">← Back to Home</a>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc, setDoc, collection, query, where, getDocs, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* Keep true while moving managers over. Turn OFF (false) when the Firestore rules are locked. */
const LEGACY_FALLBACK=false;

const $=s=>document.querySelector(s);
const say=(t,c)=>{const m=$('#msg');m.textContent=t;m.style.color=c==='red'?'#b91c1c':c==='green'?'#15803d':'inherit'};
const refCode=name=>{const l=String(name||'').replace(/[^a-z]/gi,'').slice(0,4).toUpperCase()||'MGR';return `MCC-${l}-${100+crypto.getRandomValues(new Uint32Array(1))[0]%900}`};
const legacyList=()=>{try{const a=JSON.parse(localStorage.getItem('mcc_managers')||'[]');return Array.isArray(a)?a:[]}catch{return[]}};
const BAD=['auth/invalid-credential','auth/user-not-found','auth/wrong-password','auth/invalid-login-credentials'];

async function loadProfile(user,legacy){
 /* 1) profile keyed by uid  2) old profile found by email  3) build a basic one */
 let p=null;
 try{const s=await getDoc(doc(db,'managers',user.uid));if(s.exists())p=s.data()}catch{}
 if(!p){
  try{const q=await getDocs(query(collection(db,'managers'),where('email','==',user.email)));
   const old=q.docs.find(d=>d.id!==user.uid);
   if(old){p=old.data();try{await deleteDoc(doc(db,'managers',old.id))}catch{}}   /* removes the old record that held a plain-text password */
  }catch{}
 }
 const base=p||legacy||{};
 const profile={name:base.name||user.email.split('@')[0],email:user.email,phone:base.phone||'',referralCode:base.referralCode||refCode(base.name),referralCount:Number(base.referralCount)||0,status:base.status||'active',uid:user.uid};
 if(!p||p.password!==undefined){try{await setDoc(doc(db,'managers',user.uid),{...profile,createdAt:serverTimestamp()})}catch{}}
 return profile;
}
function finish(profile){
 localStorage.setItem('mcc_current_manager',JSON.stringify(profile));   /* no password inside */
 say('Login success, opening dashboard…','green');
 setTimeout(()=>location.href='manager-dashboard.html',700);
}
function legacyLogin(email,password){
 const f=legacyList().find(m=>m.email===email&&m.password===password);if(!f)return false;
 const {password:_,...safe}=f;finish(safe);return true;
}

$('#f').addEventListener('submit',async e=>{
 e.preventDefault();
 const email=$('#email').value.trim().toLowerCase(),password=$('#password').value;
 if(!email||!password)return say('Enter your email and password.','red');
 const btn=$('#btn');btn.disabled=true;say('Signing in…');
 try{
  const cred=await signInWithEmailAndPassword(auth,email,password);
  const profile=await loadProfile(cred.user);
  if(profile.status==='disabled'){await signOut(auth);localStorage.removeItem('mcc_current_manager');say('Your account has been disabled by the admin.','red');btn.disabled=false;return}
  finish(profile);
 }catch(ex){
  console.error(ex);
  const legacy=legacyList().find(m=>m.email===email&&m.password===password);
  if(BAD.includes(ex.code)){
   if(legacy){
    /* manager from the old system: create their secure account with the same password, once */
    try{
     const cred=await createUserWithEmailAndPassword(auth,email,password);
     const {password:_,...old}=legacy;
     const profile=await loadProfile(cred.user,old);
     localStorage.setItem('mcc_managers',JSON.stringify(legacyList().filter(m=>m.email!==email)));  /* removes the stored password from this device */
     finish(profile);return;
    }catch(e2){console.error(e2)}
   }
   say('Wrong email or password.','red');
  }else if(ex.code==='auth/operation-not-allowed'||ex.code==='auth/configuration-not-found'){
   if(LEGACY_FALLBACK&&legacyLogin(email,password))return;
   say('Login is not switched on yet. The admin must enable Email/Password in Firebase Console → Authentication.','red');
  }else if(ex.code==='auth/network-request-failed'){
   say('No internet connection. Please try again.','red');
  }else if(ex.code==='auth/too-many-requests'){
   say('Too many attempts. Please wait a few minutes or reset your password.','red');
  }else{
   say('Could not sign in (' + (ex.code || ex.message) + '). Please try again.','red');
  }
  btn.disabled=false;
 }
});

$('#forgot').addEventListener('click',async()=>{
 const email=$('#email').value.trim().toLowerCase();
 if(!email)return say('Type your email above first, then tap “Forgot password?”.','red');
 try{await sendPasswordResetEmail(auth,email)}catch(ex){console.error(ex)}
 say('If an account exists for that email, a reset link has been sent.','green');   /* same message either way, so nobody can test which emails exist */
});
</script>
</body>
</html>
