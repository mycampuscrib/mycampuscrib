<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCC - Manager Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f8fafc] font-[Poppins] flex items-center justify-center min-h-screen p-4">
<div class="bg-white w-full max-w-md rounded-[20px] p-6 shadow-xl">
<div class="flex items-center gap-3 mb-6">
<img src="logo.png" alt="MCC Logo" class="w-12 h-12 rounded-full object-cover bg-[#0f172a]" onerror="this.src='https://via.placeholder.com/48?text=MCC'">
<h1 class="font-[Playfair_Display] font-bold text-xl">MyCampusCrib<span class="text-[#c9a86a]">.Luxury</span></h1>
</div>

<h2 class="font-bold text-lg mb-1">Manager Login</h2>
<p class="text-xs text-slate-500 mb-4">Access your dashboard</p>

<input id="email" placeholder="Email" type="email" class="w-full p-3 border rounded-xl mb-3 text-sm">
<input id="password" placeholder="Password" type="password" class="w-full p-3 border rounded-xl mb-4 text-sm">

<button onclick="login()" class="w-full bg-[#0f172a] text-white p-3 rounded-xl font-bold text-sm">Login</button>
<p id="msg" class="text-xs text-center mt-3"></p>
<a href="manager-signup.html" class="block text-center text-xs mt-4 text-slate-500">No account? Sign up</a>
<a href="index.html" class="block text-center text-xs mt-2 text-slate-400">← Back to Home</a>
</div>

<script>
function login(){
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();
  const msg = document.getElementById('msg');
  const managers = JSON.parse(localStorage.getItem('mcc_managers')||'[]');
  const found = managers.find(m=>m.email===email && m.password===password);
  if(!found){ msg.style.color="red"; msg.innerText="Wrong email or password"; return; }
  localStorage.setItem('mcc_current_manager', JSON.stringify(found));
  msg.style.color="green"; msg.innerText="Login success, opening dashboard...";
  setTimeout(()=> location.href="manager-dashboard.html", 800);
}
</script>
</body>
</html>
