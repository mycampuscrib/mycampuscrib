<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCC - CEO Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] font-[Poppins] min-h-screen p-4">
<div class="max-w-6xl mx-auto">
<div class="flex items-center justify-between mb-4 text-white">
<div class="flex items-center gap-3">
<img src="logo.png" class="w-10 h-10 rounded-full bg-white" onerror="this.src='https://via.placeholder.com/40?text=MCC'">
<h1 class="font-bold">CEO Dashboard - MyCampusCrib</h1>
</div>
<a href="index.html" class="text-[11px] bg-white/10 px-3 py-2 rounded-full">Home</a>
</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
<div class="bg-white rounded-xl p-3"><p class="text-[10px] text-slate-500">Total Hostels</p><h2 class="font-bold text-xl" id="totalHostels">0</h2></div>
<div class="bg-[#c9a86a] text-white rounded-xl p-3"><p class="text-[10px]">Total Inquiries / Codes</p><h2 class="font-bold text-xl" id="totalCodes">0</h2></div>
<div class="bg-white rounded-xl p-3"><p class="text-[10px] text-slate-500">Total Managers</p><h2 class="font-bold text-xl" id="totalManagers">0</h2></div>
<div class="bg-white rounded-xl p-3"><p class="text-[10px] text-slate-500">Revenue Track</p><h2 class="font-bold text-xl">GH₵ <span id="rev">0</span></h2></div>
</div>

<div class="bg-white rounded-[18px] p-4 mb-4">
<h3 class="font-bold text-sm mb-2">All Inquiry Codes (Student → Manager → Admin tracking)</h3>
<div class="overflow-x-auto">
<table class="w-full text-[11px]">
<thead class="text-slate-400 border-b"><tr><th class="text-left py-2">CODE</th><th class="text-left">Hostel</th><th class="text-left">Manager</th><th class="text-left">Status</th><th class="text-left">Date</th></tr></thead>
<tbody id="codesTable"><tr><td colspan="5" class="py-3 text-slate-400">Loading codes...</td></tr></tbody>
</table>
</div>
</div>

<div class="bg-white rounded-[18px] p-4 mb-4">
<h3 class="font-bold text-sm mb-2">All Hostels (LIVE)</h3>
<div id="allHostels" class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs"></div>
</div>

<div class="bg-white rounded-[18px] p-4">
<h3 class="font-bold text-sm mb-2">All Managers</h3>
<div id="allManagers" class="text-xs space-y-2"></div>
</div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

async function load(){
  try{
    const hostelsSnap = await getDocs(collection(db,"hostels"));
    document.getElementById('totalHostels').innerText = hostelsSnap.size;
    const hBox=document.getElementById('allHostels'); hBox.innerHTML="";
    hostelsSnap.forEach(d=>{
      const h=d.data();
      hBox.innerHTML+=`<div class="border rounded-xl p-2"><img src="${h.images?.[0]||''}" class="w-full h-24 object-cover rounded-lg mb-1"><p class="font-bold">${h.name}</p><p class="text-[10px] text-slate-500">${h.location} - GH₵${h.price}</p><p class="text-[9px]">${h.managerEmail||''}</p></div>`;
    });

    const managersSnap = await getDocs(collection(db,"managers"));
    document.getElementById('totalManagers').innerText = managersSnap.size;
    const mBox=document.getElementById('allManagers'); mBox.innerHTML="";
    managersSnap.forEach(d=>{
      const m=d.data();
      mBox.innerHTML+=`<div class="flex justify-between bg-slate-50 p-2 rounded-lg"><div><b>${m.name}</b> <span class="text-[10px]">${m.email}</span><br><span class="text-[10px] text-slate-500">Code: ${m.referralCode||'none'} - ${m.phone}</span></div></div>`;
    });

    const inquirySnap = await getDocs(query(collection(db,"inquiries"), orderBy("createdAt","desc")));
    loadInquiries(inquirySnap);
  }catch(e){
    // fallback without orderBy
    try{
      const inquirySnap2 = await getDocs(collection(db,"inquiries"));
      loadInquiries(inquirySnap2);
    }catch(err){ document.getElementById('codesTable').innerHTML=`<tr><td colspan="5" class="text-red-500">${err.message}</td></tr>`; }
  }
}

function loadInquiries(snap){
  document.getElementById('totalCodes').innerText = snap.size;
  const tbody=document.getElementById('codesTable'); tbody.innerHTML="";
  if(snap.empty){ tbody.innerHTML="<tr><td colspan='5' class='py-3 text-slate-400'>No inquiries yet. When student clicks WhatsApp on index.html, code shows here.</td></tr>"; return; }
  snap.forEach(d=>{
    const i=d.data();
    const date = i.createdAt?.seconds ? new Date(i.createdAt.seconds*1000).toLocaleDateString() : 'now';
    tbody.innerHTML+=`<tr class="border-b"><td class="py-2 font-bold">${i.code}</td><td>${i.hostelName}</td><td class="text-[10px]">${i.managerEmail||i.managerPhone}</td><td><span class="bg-slate-100 px-2 py-1 rounded-full">${i.status||'new'}</span></td><td>${date}</td></tr>`;
  });
}

load();
</script>
</body>
</html>
