<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager - MyCrib Collection</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow">
<h1 class="text-2xl font-bold mb-4">🏠 List Your Hostel</h1>

<input id="name" placeholder="Hostel Name e.g. White Hostel" class="w-full border p-3 rounded mb-3">
<select id="location" class="w-full border p-3 rounded mb-3">
<option value="">Select Location</option>
<option>Amamoma</option>
<option>Kwaprow</option>
<option>Ayensu</option>
<option>Apeosika</option>
<option>Science</option>
<option>School Bus Road</option>
<option>University Hall</option>
<option>Old Site</option>
<option>New Site</option>
</select>
<input id="price" type="number" placeholder="Price e.g. 2500" class="w-full border p-3 rounded mb-3">
<input id="phone" placeholder="WhatsApp e.g. 0551234567" class="w-full border p-3 rounded mb-3">

<label class="block font-bold mt-4 mb-2">Hostel Images (Max 5) - Cloud Upload</label>
<input id="images" type="file" multiple accept="image/*" class="w-full border p-3 rounded mb-3">

<label class="block font-bold mt-4 mb-2">🎥 Video Tour (Optional - Max 50MB)</label>
<input id="video" type="file" accept="video/*" class="w-full border p-3 rounded mb-3">
<p class="text-[11px] text-gray-500 mb-3">Show room tour - this will show in index.html as video</p>

<label class="flex items-center gap-2 mb-4">
<input id="featured" type="checkbox"> <span>Make Featured (GHS 50 via Paystack)</span>
</label>

<button onclick="submitHostel()" id="submitBtn" class="w-full bg-black text-white p-4 rounded-xl font-bold">Upload Hostel</button>
<p id="status" class="mt-3 text-center text-sm"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3...replace with yours",
  authDomain: "mycampuscrib.firebaseapp.com",
  projectId: "mycampuscrib",
  storageBucket: "mycampuscrib.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc"
};

// Try to get from your firebase.js
let app, auth, db, storage;
try {
  const mod = await import("./firebase.js");
  if(mod.app){ app=mod.app; auth=mod.auth; db=mod.db; storage=mod.storage; }
  else throw new Error();
} catch(e){
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  storage = getStorage(app);
}

let currentUser = null;
onAuthStateChanged(auth, (user)=>{
  currentUser = user;
  if(!user){
    let cur = JSON.parse(localStorage.getItem('mcc_current_manager')||'null');
    if(!cur){ /* allow guest for now but warn */ console.log("No auth, using local manager"); }
  }
});

const IMGBB_API_KEY = "6efed4c9279fad6f79caf349626d5880";

async function uploadToImgBB(file) {
  const form = new FormData();
  form.append("image", file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: form });
  const json = await res.json();
  if(!json.success) throw new Error("Image upload failed");
  return json.data.url;
}

window.submitHostel = async function() {
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const name = document.getElementById('name').value.trim();
  const location = document.getElementById('location').value.trim();
  const price = document.getElementById('price').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const files = document.getElementById('images').files;
  const videoFile = document.getElementById('video').files[0];
  const isFeatured = document.getElementById('featured').checked;

  if(!name || !location || !price || !phone || files.length==0) {
    alert("Fill all fields + add at least 1 image");
    return;
  }

  if(isFeatured) {
    const pay = confirm("Featured costs GHS 50. You will pay via Paystack, then we approve manually. Continue?");
    if(pay) window.open("https://paystack.com/pay/mcc-featured-50", "_blank");
  }

  btn.disabled = true;
  btn.innerText = "Uploading images...";
  
  try {
    status.innerText = `Uploading 1 of ${files.length} images... Don't close`;
    const urls = [];
    for(let i=0; i<files.length && i<5; i++) {
      status.innerText = `Uploading image ${i+1} of ${files.length}...`;
      const url = await uploadToImgBB(files[i]);
      urls.push(url);
    }

    let videoUrl = "";
    if(videoFile){
      if(videoFile.size > 50*1024*1024){ alert("Video too big, max 50MB"); throw new Error("Video too big"); }
      btn.innerText = "Uploading video tour...";
      status.innerText = "Uploading video... this may take 30s";
      const storageRef = ref(storage, `hostelVideos/${Date.now()}_${videoFile.name}`);
      await uploadBytes(storageRef, videoFile);
      videoUrl = await getDownloadURL(storageRef);
    }

    const hostelData = {
      name, location, price: Number(price), phone,
      images: urls,
      videoUrl: videoUrl,
      video: videoUrl,
      isFeatured: isFeatured ? true : false,
      featured: isFeatured ? "pending_payment" : false,
      status: "pending",
      managerId: currentUser ? currentUser.uid : (JSON.parse(localStorage.getItem('mcc_current_manager')||'{}').uid || "guest"),
      managerEmail: currentUser ? currentUser.email : (JSON.parse(localStorage.getItem('mcc_current_manager')||'{}').email || phone),
      lat: location==="School Bus Road" ? 5.121 : location==="Apeosika" ? 5.115 : 5.119,
      lng: location==="School Bus Road" ? -1.285 : location==="Apeosika" ? -1.29 : -1.287,
      views: 0,
      saves: 0,
      createdAt: serverTimestamp(),
      date: new Date().toISOString()
    };

    // SAVE TO FIREBASE (real)
    btn.innerText = "Saving to database...";
    await addDoc(collection(db, "hostels"), hostelData);

    // ALSO keep local backup for instant view
    const existing = JSON.parse(localStorage.getItem('hostels') || '[]');
    existing.push({...hostelData, id: Date.now()});
    localStorage.setItem('hostels', JSON.stringify(existing));

    status.innerText = "✅ Success! Hostel + video uploaded. Waiting CEO approval.";
    btn.innerText = "Uploaded ✅";
    setTimeout(()=>{ window.location.href = "manager-dashboard.html"; }, 1500);

  } catch(e) {
    console.error(e);
    alert("Upload failed: " + e.message);
    btn.disabled = false;
    btn.innerText = "Upload Hostel";
    status.innerText = "Failed: "+e.message;
  }
}
</script>
</body>
</html>
