<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCC - Add Hostel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f8fafc] font-[Poppins] p-4">
<div class="max-w-2xl mx-auto bg-white rounded-[20px] p-6 shadow-xl mt-4">
<div class="flex items-center justify-between mb-6">
<h1 class="font-bold text-sm">Add Hostel - Secure Mode (Admin Approval)</h1>
<a href="manager-dashboard.html" class="text-xs bg-slate-100 px-3 py-2 rounded-full">Dashboard</a>
</div>

<input id="hname" placeholder="Hostel Name - e.g. Theo Hostel" class="w-full p-3 border rounded-xl mb-3 text-sm">
<input id="location" placeholder="Location - e.g. Amamoma" class="w-full p-3 border rounded-xl mb-3 text-sm">
<input id="price" placeholder="Price per year - e.g. 3000" type="number" class="w-full p-3 border rounded-xl mb-3 text-sm">
<input id="beds" placeholder="Beds available" type="number" class="w-full p-3 border rounded-xl mb-3 text-sm">
<select id="type" class="w-full p-3 border rounded-xl mb-3 text-sm">
<option value="Single Room">Single Room</option>
<option value="Self Contain">Self Contain</option>
<option value="2 in 1">2 in 1</option>
<option value="3 in 1">3 in 1</option>
<option value="4 in 1">4 in 1</option>
</select>
<textarea id="desc" placeholder="Description..." class="w-full p-3 border rounded-xl mb-3 text-sm h-20"></textarea>

<label class="text-xs font-bold">Your WhatsApp Number (with country code e.g. 233500000000)</label>
<input id="managerPhone" placeholder="233XXXXXXXXX" class="w-full p-3 border rounded-xl mb-3 text-sm">

<label class="text-xs font-bold mb-1 block">Hostel Images (4 images max - compressed to fit free plan)</label>
<input id="images" type="file" multiple accept="image/*" class="w-full p-2 border rounded-xl mb-4 text-xs">

<button id="uploadBtn" onclick="uploadHostel()" class="w-full bg-[#0f172a] text-white p-3 rounded-xl font-bold">Upload for Approval</button>
<p id="msg" class="text-xs text-center mt-3"></p>
<p class="text-[10px] text-center mt-2 text-slate-400">After upload, go to admin.html to Approve → then it will show on index.html</p>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

function compressToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const MAX = 400; // smaller to allow 4 images in Firestore (1MB limit)
        let w = img.width, h = img.height;
        if(w>h){ if(w>MAX){ h*=MAX/w; w=MAX; } } else { if(h>MAX){ w*=MAX/h; h=MAX; } }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.4)); // more compressed for 4 images
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

window.uploadHostel = async function(){
  const cur = JSON.parse(localStorage.getItem('mcc_current_manager')||'null');
  if(!cur){ alert("Login first"); location.href="manager-login.html"; return; }
  const btn=document.getElementById('uploadBtn');
  const msg=document.getElementById('msg');
  btn.disabled=true; btn.innerText="Compressing..."; msg.innerText="Compressing 4 images...";
  msg.style.color="black";
  try{
    const name=document.getElementById('hname').value.trim();
    const locationVal=document.getElementById('location').value.trim();
    const price=document.getElementById('price').value.trim();
    let phoneRaw=document.getElementById('managerPhone').value.trim()||cur.phone||"";
    // Fix WhatsApp number: remove spaces, +, make sure it works with wa.me
    let cleanPhone = phoneRaw.replace(/\D/g,'');
    if(cleanPhone.startsWith('0')) cleanPhone = '233'+cleanPhone.substring(1);
    if(!cleanPhone.startsWith('233') && cleanPhone.length==10) cleanPhone = '233'+cleanPhone.substring(1);
    
    if(!name||!locationVal||!price) throw new Error("Fill name, location, price");
    if(!cleanPhone) throw new Error("Enter WhatsApp number");
    const files=document.getElementById('images').files;
    if(files.length===0) throw new Error("Select at least 1 image");
    if(files.length>4) throw new Error("Max 4 images allowed");
    
    let imageUrls=[];
    for(let i=0;i<files.length;i++){
      msg.innerText=`Compressing ${i+1}/${files.length}...`;
      const base64 = await compressToBase64(files[i]);
      imageUrls.push(base64);
    }
    
    msg.innerText="Saving for admin approval...";
    await addDoc(collection(db,"hostels"),{
      name, location:locationVal, price:Number(price),
      beds:Number(document.getElementById('beds').value)||1,
      type:document.getElementById('type').value,
      description:document.getElementById('desc').value.trim(),
      managerPhone:cleanPhone, // now clean for wa.me
      managerEmail:cur.email, managerName:cur.name,
      images:imageUrls, videoUrl:"",
      status:"pending", // <-- SECURE: needs your approval
      views:0, inquiries:0,
      createdAt:serverTimestamp()
    });
    msg.style.color="green"; msg.innerText="✅ Sent for Approval! Go to admin.html to approve it.";
    btn.innerText="Done!";
    setTimeout(()=>location.href="manager-dashboard.html",1500);
  }catch(e){
    console.error(e);
    msg.style.color="red"; msg.innerText="Error: "+e.message;
    btn.disabled=false; btn.innerText="Upload for Approval";
  }
}
</script>
</body>
</html>
