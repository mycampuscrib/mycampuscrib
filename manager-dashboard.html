<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCC - Manager Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f8fafc] font-[Poppins] p-4">
<div class="max-w-4xl mx-auto">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-3">
<img src="logo.png" class="w-10 h-10 rounded-full bg-[#0f172a]" onerror="this.src='https://via.placeholder.com/40?text=MCC'">
<div>
<h1 class="font-bold text-sm" id="mName">Manager</h1>
<p class="text-[10px] text-slate-500" id="mEmail"></p>
</div>
</div>
<button onclick="logout()" class="text-xs bg-red-50 text-red-600 px-3 py-2 rounded-full">Logout</button>
</div>

<!-- CODES BOX -->
<div class="bg-[#0f172a] text-white rounded-[18px] p-4 mb-4">
<p class="text-[10px] opacity-70">YOUR REFERRAL CODE (manager/student tracking)</p>
<h2 class="font-bold text-xl tracking-widest" id="refCode">MCC-XXXX</h2>
<p class="text-[10px] mt-2 opacity-60">Share this code — when student uses it to chat, you get lead</p>
</div>

<div class="grid grid-cols-2 gap-3 mb-4">
<a href="manager.html" class="bg-[#c9a86a] text-white text-center p-3 rounded-xl font-bold text-sm">+ Add Hostel</a>
<button onclick="loadHostels()" class="bg-white border p-3 rounded-xl font-bold text-sm">Refresh</button>
</div>

<div class="bg-white rounded-[18px] p-4 shadow-sm mb-4">
<h3 class="font-bold text-sm mb-2">Leads / Inquiry Codes (Student → You)</h3>
<div id="leads" class="text-xs space-y-2"><p class="text-slate-400">Loading leads...</p></div>
</div>

<div class="bg-white rounded-[18px] p-4 shadow-sm">
<h3 class="font-bold text-sm mb-2">My Hostels (LIVE)</h3>
<div id="myHostels" class="grid grid-cols-1 md:grid-cols-2 gap-3"><p class="text-xs text-slate-400">Loading...</p></div>
</div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cur = JSON.parse(localStorage.getItem('mcc_current_manager')||'null');
if(!cur){ location.href="manager-login.html"; }
document.getElementById('mName').innerText=cur.name;
document.getElementById('mEmail').innerText=cur.email;
document.getElementById('refCode').innerText=cur.referralCode||"MCC-XXXX";

window.logout = ()=>{ localStorage.removeItem('mcc_current_manager'); location.href="manager-login.html"; }

window.loadHostels = async()=>{
  const box=document.getElementById('myHostels');
  box.innerHTML="<p class='text-xs text-slate-400'>Loading...</p>";
  try{
    const q=query(collection(db,"hostels"), where("managerEmail","==",cur.email));
    const snap=await getDocs(q);
    if(snap.empty){ box.innerHTML="<p class='text-xs text-slate-400'>No hostels yet. Add one.</p>"; return; }
    box.innerHTML="";
    snap.forEach(d=>{
      const h=d.data();
      box.innerHTML+=`<div class="border rounded-xl p-3">
      <img src="${h.images?.[0]||''}" class="w-full h-32 object-cover rounded-lg mb-2">
      <p class="font-bold text-sm">${h.name}</p>
      <p class="text-[11px] text-slate-500">${h.location} - GH₵${h.price}</p>
      <p class="text-[10px] text-green-600 mt-1">LIVE for students ✅</p>
      </div>`;
    });
  }catch(e){ box.innerHTML=`<p class='text-xs text-red-500'>${e.message}</p>`; }
}

async function loadLeads(){
  const box=document.getElementById('leads');
  try{
    const q=query(collection(db,"inquiries"), where("managerEmail","==",cur.email), orderBy("createdAt","desc"));
    const snap=await getDocs(q);
    if(snap.empty){ box.innerHTML="<p class='text-slate-400'>No inquiries yet. When student clicks WhatsApp, code appears here.</p>"; return; }
    box.innerHTML="";
    snap.forEach(d=>{
      const i=d.data();
      box.innerHTML+=`<div class="flex justify-between bg-slate-50 p-2 rounded-lg">
      <div><p class="font-bold">${i.code}</p><p class="text-[10px]">${i.hostelName} - ${new Date(i.createdAt?.seconds*1000).toLocaleDateString()}</p></div>
      <span class="text-[10px] bg-white px-2 py-1 rounded-full h-fit">${i.status||'new'}</span></div>`;
    });
  }catch(e){ box.innerHTML=`<p class='text-red-400'>Need index - showing without sort</p>`; 
    // fallback without orderBy
    try{
      const snap2=await getDocs(query(collection(db,"inquiries"), where("managerEmail","==",cur.email)));
      box.innerHTML=""; snap2.forEach(d=>{ const i=d.data(); box.innerHTML+=`<div class="bg-slate-50 p-2 rounded-lg text-[11px]"><b>${i.code}</b> - ${i.hostelName}</div>`; });
    }catch{}
  }
}

loadHostels(); loadLeads();
</script>
</body>
</html>
