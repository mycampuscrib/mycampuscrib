<!DOCTYPE html>
<html>
<head>
<title>Manager Signup - MyCampusCrib</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:sans-serif; padding:20px; max-width:400px; margin:auto;">
<h2>Create Manager Account</h2>
<input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;margin:8px 0;"><br>
<input id="password" type="password" placeholder="Password (6+ chars)" style="width:100%;padding:12px;margin:8px 0;"><br>
<input id="hostelName" type="text" placeholder="Hostel Name" style="width:100%;padding:12px;margin:8px 0;"><br>
<button id="signupBtn" style="width:100%;padding:14px;background:#000;color:#fff;border:none;">Create Account</button>
<p id="msg"></p>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const btn = document.getElementById('signupBtn');
const msg = document.getElementById('msg');

btn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const hostelName = document.getElementById('hostelName').value.trim();
  
  if(!email || !password || !hostelName){
    msg.textContent = "Fill all fields";
    return;
  }
  
  msg.textContent = "Creating...";
  btn.disabled = true;
  
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "managers", cred.user.uid), {
      email: email,
      hostelName: hostelName,
      createdAt: new Date(),
      role: "manager"
    });
    msg.textContent = "Account created! Redirecting...";
    setTimeout(()=> location.href = "manager-login.html", 1000);
  } catch(err){
    msg.textContent = err.message;
    btn.disabled = false;
    console.error(err);
  }
});
</script>
</body>
</html>
