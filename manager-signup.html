<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager Signup - MCC</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;font-family:Poppins}body{background:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}.box{background:white;padding:28px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.1);max-width:420px;width:100%}input,select{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:10px;margin:7px 0}button{width:100%;padding:12px;background:#0f172a;color:white;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin-top:10px}</style></head><body>
<div class="box"><h2>🏠 Manager Signup</h2><p style="font-size:12px;color:#64748b">Create account to list your hostel</p>
<input id="name" placeholder="Full Name"><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="WhatsApp Number e.g. 024..."><input id="hName" placeholder="Hostel Name"><select id="loc"><option value="">Select Location</option><option>Amamoma</option><option>Kwaprow</option><option>Ayensu</option></select><input id="pass" type="password" placeholder="Password"><button onclick="signup()">Create Account</button><p style="font-size:12px;text-align:center;margin-top:12px">Already have? <a href="manager-login.html">Login</a> | <a href="index.html">Home</a></p><p id="msg" style="font-size:12px;color:red"></p></div>
<script>
function signup(){
 let name=document.getElementById('name').value.trim(), email=document.getElementById('email').value.trim().toLowerCase(), phone=document.getElementById('phone').value.trim(), hostelName=document.getElementById('hName').value.trim(), location=document.getElementById('loc').value, pass=document.getElementById('pass').value;
 if(!name||!email||!phone||!hostelName||!location||!pass){document.getElementById('msg').innerText='Fill all fields';return}
 let managers=JSON.parse(localStorage.getItem('mcc_managers')||'[]');
 if(managers.find(m=>m.email===email)){document.getElementById('msg').innerText='Email already exists, login';return}
 managers.push({name,email,phone,hostelName,location,password:pass,created:Date.now()});
 localStorage.setItem('mcc_managers',JSON.stringify(managers));
 localStorage.setItem('mcc_current_manager',JSON.stringify({name,email,phone,hostelName,location}));
 alert('✅ Account created! Now list your hostel details'); window.location.href='manager.html';
}
</script></body></html>
